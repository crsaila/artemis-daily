  <title>Artemis II</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0c0c0c;
      --fg: #e0ddd8;
      --muted: rgba(224, 221, 216, 0.32);
      --subtle: rgba(224, 221, 216, 0.08);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', ui-monospace, monospace;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding: clamp(1.25rem, 3vw, 2rem);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: clamp(1.25rem, 3vh, 2rem);
      flex-shrink: 0;
    }

    .label {
      font-size: 0.625rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 400;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
    }

    .photo-wrap {
      max-width: min(100%, 1100px);
      width: 100%;
      position: relative;
    }

    .photo-link {
      display: block;
    }

    #photo {
      display: block;
      width: 100%;
      height: auto;
      max-height: calc(100vh - 8rem);
      object-fit: contain;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    #photo.loaded {
      opacity: 1;
    }

    .spinner {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 0.625rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .spinner.hidden {
      display: none;
    }

    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: clamp(1rem, 2vh, 1.5rem);
      margin-top: clamp(1rem, 2vh, 1.5rem);
      border-top: 1px solid var(--subtle);
      flex-shrink: 0;
    }

    .photo-id {
      font-size: 0.625rem;
      letter-spacing: 0.12em;
      color: var(--muted);
    }

    .photo-id a {
      color: inherit;
      text-decoration: none;
      transition: color 0.15s;
    }

    .photo-id a:hover {
      color: var(--fg);
    }

    button {
      background: none;
      border: 1px solid var(--subtle);
      color: var(--muted);
      font-family: inherit;
      font-size: 0.625rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      padding: 0.5rem 1.125rem;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }

    button:hover {
      color: var(--fg);
      border-color: var(--muted);
    }

    button:active {
      opacity: 0.6;
    }
  </style>
</head>

    function applyPhoto(frame, imgSrc) {
      const img    = document.getElementById('photo');
      const link   = document.getElementById('photo-link');
      const idLink = document.getElementById('photo-id-link');
      const spinner = document.getElementById('spinner');
      const detailUrl = BASE_DETAIL + frame;

      img.classList.remove('loaded');
      spinner.classList.remove('hidden');
      spinner.textContent = 'Loading';

      img.onload  = () => { spinner.classList.add('hidden'); img.classList.add('loaded'); };
      img.onerror = () => { spinner.textContent = 'Not found'; };

      img.alt            = 'ART002-E-' + frame;
      link.href          = detailUrl;
      idLink.textContent = 'ART002-E-' + frame;

      .then(r => r.json())
      .then(({ frame }) => applyPhoto(frame, '/today.jpg'))
